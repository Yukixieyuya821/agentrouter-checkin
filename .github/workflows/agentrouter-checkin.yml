name: AgentRouter 每日签到

on:
  schedule:
    # GitHub Actions 使用 UTC；每天北京时间 00:25 执行
    - cron: "25 16 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MIHOMO_ENABLED: ${{ secrets.MIHOMO_CONFIG_B64 != '' }}
    permissions:
      contents: read
    outputs:
      failure_notified: ${{ steps.checkin.outputs.failure_notified }}
      step_results: >-
        {"checkout":"${{ steps.checkout.outcome }}",
         "setup_python":"${{ steps.setup_python.outcome }}",
         "dependencies":"${{ steps.dependencies.outcome }}",
         "mihomo":"${{ steps.mihomo.outcome }}",
         "checkin":"${{ steps.checkin.outcome }}"}

    steps:
      - name: 📥 检出代码
        id: checkout
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 📦 安装依赖
        id: dependencies
        run: pip install -r requirements.txt

      - name: 🌐 安装 Mihomo 代理内核（可选）
        id: mihomo
        if: env.MIHOMO_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pip install PyYAML==6.0.2
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.28/mihomo-linux-amd64-v1-v1.19.28.gz \
            --output "$RUNNER_TEMP/mihomo.gz"
          echo "c0c446f0b0e0bceffffa32daad220ffd35915b9f576f35557f49226f09f54a72  $RUNNER_TEMP/mihomo.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod 700 "$RUNNER_TEMP/mihomo"

      - name: ✅ 执行签到并发送邮件通知
        id: checkin
        env:
          MIHOMO_CONFIG_B64: ${{ secrets.MIHOMO_CONFIG_B64 }}
          MIHOMO_BINARY: ${{ runner.temp }}/mihomo
          # AgentRouter 配置
          AGENTROUTER_BASE_URL: ${{ vars.AGENTROUTER_BASE_URL }}
          AGENTROUTER_USERNAME: ${{ secrets.AGENTROUTER_USERNAME || vars.AGENTROUTER_USERNAME }}
          # 优先读取 Secret，并兼容原先存放在 Variable 中的配置
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD || vars.AGENTROUTER_PASSWORD }}
          AGENTROUTER_ACCOUNTS: ${{ secrets.AGENTROUTER_ACCOUNTS || vars.AGENTROUTER_ACCOUNTS }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY || vars.SOCKS5_PROXY }}

          # SMTP 邮件配置
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY || vars.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME || vars.EMAIL_FROM_NAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || vars.EMAIL_TO }}
        run: python scripts/run_with_mihomo.py

  notify_failure:
    name: 📧 工作流失败邮件通知
    needs: checkin
    if: ${{ failure() && needs.checkin.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📥 检出通知代码
        uses: actions/checkout@v4

      # 使用运行器自带的 Python 3 和标准库，不依赖签到作业的 pip 或代理。
      - name: 📧 发送失败通知（最多尝试三次）
        env:
          FAILED_STEP_RESULTS: ${{ needs.checkin.outputs.step_results }}
          FAILURE_ALREADY_NOTIFIED: ${{ needs.checkin.outputs.failure_notified }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY || vars.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME || vars.EMAIL_FROM_NAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || vars.EMAIL_TO }}
        run: python3 scripts/notify_failure.py
